apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service-lab
  labels:
    app: hello-service-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-service-lab
  template:
    metadata:
      labels:
        app: hello-service-lab
    spec:
      containers:
        - name: hello-service
          image: hello-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
