name: Helm Chart CI

on:
  push:
    branches: [main]
    paths:
      - 'helm/hello-service/**'
      - '.github/workflows/helm-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'helm/hello-service/**'
      - '.github/workflows/helm-ci.yml'

permissions:
  contents: read

jobs:
  validate-helm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: helm lint helm/hello-service

      - name: Render Helm templates
        run: |
          helm template hello-gitops helm/hello-service \
            --set podLabels.gitops-release=hello-gitops \
            > /tmp/hello-gitops-rendered.yaml

      - name: Verify rendered resources
        run: |
          grep -q 'kind: Deployment' /tmp/hello-gitops-rendered.yaml
          grep -q 'kind: Service' /tmp/hello-gitops-rendered.yaml
          grep -q 'replicas: 2' /tmp/hello-gitops-rendered.yaml
