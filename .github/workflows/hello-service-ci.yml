name: Hello Service CI

on:
  push:
    branches: [main]
    paths:
      - 'services/hello-service/**'
      - '.github/workflows/hello-service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/hello-service/**'
      - '.github/workflows/hello-service-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test Python syntax
        run: python -m py_compile services/hello-service/app.py

      - name: Run application tests
        working-directory: services/hello-service
        run: python -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ./services/hello-service
          load: true
          tags: hello-service:ci

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hello-service:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./services/hello-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hello-service:latest
            ghcr.io/${{ github.repository_owner }}/hello-service:${{ github.sha }}

      - name: Update Kubernetes manifest
        run: |
          sed -i "s|image: .*|image: ghcr.io/${{ github.repository_owner }}/hello-service:${{ github.sha }}|" kubernetes/hello-service-deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/hello-service-deployment.yaml

          if git diff --cached --quiet; then
            echo "Kubernetes manifest already uses this image."
          else
            git commit -m "Update hello-service image to ${{ github.sha }}"
            git push
          fi
